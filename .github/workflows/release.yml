name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "LOCKER_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "LOCKER_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LOCKER_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret, publishing a debug-signed APK"
          fi

      - name: Build APK
        env:
          LOCKER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LOCKER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LOCKER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -n "$LOCKER_KEYSTORE" ]]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "locker-$LOCKER_VERSION_NAME.apk"
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "locker-$LOCKER_VERSION_NAME.apk"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: locker-apk
          path: locker-*.apk

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" locker-*.apk \
            --title "Locker $GITHUB_REF_NAME" \
            --generate-notes
